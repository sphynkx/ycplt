<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Локальный чат</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #1a1a1a;
  }

  #app { display: flex; height: 100vh; }

  /* ---------- Сайдбар ---------- */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #202123;
    color: #ececf1;
    display: flex;
    flex-direction: column;
  }
  #sidebar-header { padding: 12px; }
  #new-chat-btn {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #565869;
    border-radius: 8px;
    background: transparent;
    color: #ececf1;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
  }
  #new-chat-btn:hover { background: #2b2c2f; }
  #conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    color: #ececf1;
  }
  .conv-item:hover { background: #2b2c2f; }
  .conv-item.active { background: #343541; }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Rename (✎) and download (⬇) sit alongside the pre-existing delete
     (✕) button — same hover-to-reveal pattern, so the row stays quiet
     until you actually mouse over it. */
  .del-btn, .dl-btn, .ren-btn {
    opacity: 0;
    background: none;
    border: none;
    color: #8e8ea0;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .conv-item:hover .del-btn,
  .conv-item:hover .dl-btn,
  .conv-item:hover .ren-btn { opacity: 1; }
  .del-btn:hover, .dl-btn:hover, .ren-btn:hover { color: #ececf1; }
  /* Replaces .conv-title in place while a rename is in progress (see
     startRenameConversation in static/js/app.js) — sized/colored to sit
     naturally in the same dark sidebar row. */
  .conv-title-input {
    flex: 1;
    min-width: 0;
    background: #343541;
    border: 1px solid #565869;
    border-radius: 4px;
    color: #ececf1;
    font-size: 0.85rem;
    padding: 2px 6px;
    font-family: inherit;
  }
  #sidebar-empty { padding: 12px 10px; font-size: 0.8rem; color: #8e8ea0; }

  /* ---------- Основная область ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #f5f5f7; }
  #chat-header { padding: 14px 20px 6px; }
  #chat-header h1 { font-size: 1.15rem; margin: 0 0 2px; }
  #chat-header .hint { color: #666; font-size: 0.8rem; }

  #chat-area { flex: 1; overflow-y: auto; padding: 12px 20px; }
  #history {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    margin: 0 auto;
  }

  .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
  .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.bot { align-self: flex-start; align-items: flex-start; }

  .bubble { position: relative; padding: 10px 14px; border-radius: 10px; line-height: 1.4; }
  .msg-wrap.user .bubble { background: #2563eb; color: #fff; }
  .msg-wrap.bot .bubble { background: #fff; border: 1px solid #ddd; }
  .msg-wrap.pending .bubble { color: #888; font-style: italic; }
  .msg-wrap.error .bubble { color: #c0392b; background: #fdecea; border-color: #f5c6cb; }

  .msg-text { white-space: pre-wrap; }
  .msg-text + .msg-text { margin-top: 8px; }
  .msg-heading { margin: 12px 0 4px; font-weight: 600; line-height: 1.3; }
  .msg-heading:first-child { margin-top: 0; }
  .msg-heading + .msg-text { margin-top: 0; }
  .code-block {
    position: relative;
    background: #0d1117;
    color: #e6edf3;
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 0.82rem;
    margin: 8px 0;
  }
  .code-block code { font-family: Consolas, Monaco, monospace; white-space: pre; }

  /* ---------- Кнопка копирования (карточка целиком + отдельные блоки кода) ---------- */
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    border: none;
    border-radius: 5px;
    font-size: 0.78rem;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
    background: rgba(0, 0, 0, 0.08);
    color: inherit;
  }
  .bubble:hover .copy-btn,
  .code-block:hover .copy-btn,
  .copy-btn.copied {
    opacity: 1;
  }
  .copy-btn:hover { background: rgba(0, 0, 0, 0.16); }
  .msg-wrap.user .bubble .copy-btn { background: rgba(255, 255, 255, 0.28); }
  .msg-wrap.user .bubble .copy-btn:hover { background: rgba(255, 255, 255, 0.42); }
  .code-block .copy-btn { background: rgba(255, 255, 255, 0.12); color: #e6edf3; }
  .code-block .copy-btn:hover { background: rgba(255, 255, 255, 0.22); }

  /* Sits to the left of .msg-copy-btn (same top-right corner, offset by
     one button-width + gap) rather than stacking on top of it — both are
     .copy-btn for shared hover/opacity behavior, this just repositions.
     Labeled "PDF" as plain text rather than an emoji — 📄 (page facing
     up) used to double as both this button AND the generic file-card
     icon (renderFileCard in app.js), so the two looked identical despite
     meaning different things; there's no single emoji that reads
     unambiguously as "PDF" across platforms, so a short text label is the
     more reliable choice here. */
  .bubble .pdf-export-btn {
    right: 40px;
    text-decoration: none;
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .file-card {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 8px;
    background: #fafafa;
    font-size: 0.82rem;
  }
  .file-card .icon { font-size: 1.05rem; }
  .file-card a { color: #2563eb; text-decoration: none; font-weight: 500; }
  .file-card a:hover { text-decoration: underline; }
  .file-card .meta { color: #999; margin-left: auto; white-space: nowrap; }

  .image-attachment { margin-top: 8px; }
  .image-attachment img {
    max-width: 100%;
    max-height: 420px;
    border-radius: 8px;
    border: 1px solid #ddd;
    display: block;
  }

  .msg-meta { font-size: 0.72rem; color: #999; margin-top: 4px; padding: 0 4px; }

  /* ---------- Форма отправки ---------- */
  #composer { border-top: 1px solid #ddd; background: #f5f5f7; padding: 12px 20px; }
  #composer-inner { max-width: 760px; margin: 0 auto; }
  form { display: flex; gap: 8px; }
  textarea {
    flex: 1;
    resize: none;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  /* Attach + help toggle, stacked vertically in one narrow column instead
     of two full-height buttons — the original side-by-side 42px-wide
     buttons ate noticeably into the textarea's own width for no benefit,
     since neither is used anywhere near as often as typing itself. */
  #composer-icons { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .composer-icon-btn {
    width: 34px;
    height: 27px;
    padding: 0;
    line-height: 1;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .composer-icon-btn:hover { background: #ececec; }
  /* Armed state for #help-btn (see static/js/app.js's setHelpMode) — the
     button doesn't send anything by itself, it just marks the NEXT
     message for forced help-mode routing, so it needs a clearly different
     look while armed or a user could easily forget it's on. */
  .composer-icon-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  button[type="submit"] {
    padding: 0 18px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button[type="submit"]:disabled { background: #9db4e0; cursor: not-allowed; }
  #error { color: #c0392b; font-size: 0.85rem; margin-top: 8px; }

  #attachment-preview {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    font-size: 0.82rem;
  }
  #attachment-preview .attachment-thumb {
    width: 36px;
    height: 36px;
    object-fit: cover;
    border-radius: 6px;
  }
  #attachment-preview .attachment-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #444; }
  #attachment-preview .attachment-hint { color: #999; }
  #attachment-preview .attachment-remove {
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  #attachment-preview .attachment-remove:hover { color: #c0392b; }

  #help-mode-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    border: 1px solid #2563eb;
    border-radius: 8px;
    background: #eef3ff;
    font-size: 0.82rem;
    color: #1d4ed8;
  }
  #help-mode-indicator .help-mode-cancel {
    background: none;
    border: none;
    color: #1d4ed8;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
    margin-left: auto;
  }
  #help-mode-indicator .help-mode-cancel:hover { color: #c0392b; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <button id="new-chat-btn" type="button">+ Новый чат</button>
    </div>
    <div id="conv-list"></div>
  </aside>

  <main id="main">
    <div id="chat-header">
      <h1>Локальный чат</h1>
      <div class="hint">Модель работает на CPU — ответ может занимать десятки секунд.</div>
    </div>

    <div id="chat-area"><div id="history"></div></div>

    <div id="composer">
      <div id="composer-inner">
        <div id="attachment-preview">
          <img class="attachment-thumb" alt="">
          <span class="attachment-name"></span>
          <span class="attachment-hint">— изображение будет отредактировано согласно запросу</span>
          <button type="button" class="attachment-remove" title="Убрать вложение">✕</button>
        </div>
        <div id="help-mode-indicator">
          <span>Режим помощи включён — следующее сообщение обработает помощник (вопрос может быть любым)</span>
          <button type="button" class="help-mode-cancel" title="Отменить режим помощи">✕</button>
        </div>
        <form id="chat-form">
          <div id="composer-icons">
            <button id="attach-btn" class="composer-icon-btn" type="button" title="Прикрепить изображение для редактирования">📎</button>
            <button id="help-btn" class="composer-icon-btn" type="button" title="Режим помощи: следующее сообщение обработает помощник">❓</button>
          </div>
          <input id="image-input" type="file" accept="image/*" hidden>
          <textarea id="query" rows="2" placeholder="Напиши сообщение..." required></textarea>
          <button id="send-btn" type="submit">Отправить</button>
        </form>
        <div id="error"></div>
      </div>
    </div>
  </main>
</div>

<script src="/static/js/app.js?v={{ static_version }}"></script>
</body>
</html>
